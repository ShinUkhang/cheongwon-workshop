<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의용 프롬프트 보드 — 우리 반 스마트 알리미</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F1F5F9; --card: #FFFFFF; --ink: #0F172A; --sub: #64748B;
    --brand: #4F46E5; --brand-soft: #EEF2FF; --line: #E2E8F0;
    --radius: 16px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Pretendard", sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: var(--ink); color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
  header h1 span { color: #A5B4FC; }
  header .hint { font-size: 13px; color: #94A3B8; }
  .layout { display: flex; flex: 1; min-height: 0; }
  nav {
    width: 300px; flex-shrink: 0; background: var(--card);
    border-right: 1px solid var(--line); overflow-y: auto; padding: 12px;
  }
  .step-btn {
    width: 100%; text-align: left; background: #fff; border: 2px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
    display: flex; gap: 12px; align-items: center; transition: all .15s;
    font-family: inherit;
  }
  .step-btn:hover { border-color: #C7D2FE; background: #FAFAFF; }
  .step-btn.active { border-color: var(--brand); background: var(--brand-soft); }
  .step-btn .num {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: #F1F5F9; color: var(--brand); font-weight: 800; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .step-btn.active .num { background: var(--brand); color: #fff; }
  .step-btn .meta { min-width: 0; }
  .step-btn .t { font-size: 14.5px; font-weight: 700; }
  .step-btn .d { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .step-btn .time {
    margin-left: auto; flex-shrink: 0; font-size: 11px; color: var(--sub);
    background: #F8FAFC; border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 9px; white-space: nowrap;
  }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 20px 24px; }
  .prompt-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-shrink: 0; }
  .prompt-head .badge {
    background: var(--brand); color: #fff; font-weight: 800; font-size: 15px;
    border-radius: 10px; padding: 6px 14px;
  }
  .prompt-head h2 { font-size: 20px; font-weight: 800; }
  .prompt-head .time { font-size: 13px; color: var(--sub); }
  .prompt-head .spacer { flex: 1; }
  .btn {
    border: none; border-radius: 12px; padding: 11px 20px; font-size: 15px;
    font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .btn-copy { background: var(--brand); color: #fff; }
  .btn-copy:hover { background: #4338CA; }
  .btn-copy.done { background: #059669; }
  .btn-nav { background: #fff; color: var(--ink); border: 2px solid var(--line); }
  .btn-nav:hover:not(:disabled) { border-color: var(--brand); }
  .btn-nav:disabled { opacity: .35; cursor: default; }
  .btn-font { background: #fff; color: var(--sub); border: 2px solid var(--line); padding: 11px 14px; }
  .prompt-box {
    flex: 1; min-height: 0; background: var(--card); border: 2px solid var(--line);
    border-radius: var(--radius); padding: 28px 32px; overflow-y: auto;
    font-size: 17px; line-height: 1.75; white-space: pre-wrap; word-break: keep-all;
  }
  .prompt-box.large { font-size: 21px; line-height: 1.8; }
  .prompt-box code, .prompt-box .code {
    font-family: "SF Mono", "D2Coding", Consolas, monospace;
    background: #F8FAFC; border-radius: 6px; padding: 1px 6px; font-size: .92em;
  }
  footer {
    display: flex; align-items: center; gap: 10px; padding-top: 14px; flex-shrink: 0;
  }
  footer .progress { font-size: 13px; color: var(--sub); margin-left: auto; }
  footer .bar { width: 160px; height: 8px; background: #E2E8F0; border-radius: 999px; overflow: hidden; }
  footer .bar i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .25s; }
  .sub { background: #F8FAFC; border: 2px solid var(--line); border-radius: 12px;
    margin-bottom: 14px; overflow: hidden; }
  .sub-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #fff; border-bottom: 1px solid var(--line); }
  .sub-badge { background: var(--brand); color: #fff; font-weight: 800; font-size: 13px;
    border-radius: 8px; padding: 4px 10px; }
  .sub-title { font-weight: 700; font-size: 15px; }
  .sub-head .spacer { flex: 1; }
  .btn-mini { padding: 7px 14px; font-size: 13px; }
  .sub-text { padding: 14px 16px; font-size: 15px; line-height: 1.7;
    white-space: pre-wrap; word-break: keep-all; margin: 0; }
  @media (max-width: 760px) {
    nav { width: 210px; }
    .prompt-box { padding: 18px; font-size: 15px; }
    header .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🎤 강의용 프롬프트 보드 <span>— 우리 반 스마트 알리미</span></h1>
  <div class="hint">← → 키로 이동 · 클릭 한 번이면 프롬프트 표시</div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="prompt-head">
      <div class="badge" id="badge">P1</div>
      <h2 id="title"></h2>
      <span class="time" id="time"></span>
      <div class="spacer"></div>
      <button class="btn btn-font" id="fontBtn" title="글자 크게/보통">🔍 크게</button>
      <button class="btn btn-copy" id="copyBtn">📋 복사하기</button>
    </div>
    <div class="prompt-box" id="box"></div>
    <footer>
      <button class="btn btn-nav" id="prevBtn">◀ 이전</button>
      <button class="btn btn-nav" id="nextBtn">다음 ▶</button>
      <div class="progress"><span id="pgText"></span></div>
      <div class="bar"><i id="pgBar"></i></div>
    </footer>
  </main>
</div>
<script>
const PROMPTS = [{"id": "P1", "title": "시간표 사진 인식", "time": "0–10분", "desc": "시간표 사진을 CSV로 추출", "text": "안티그래비티, 내가 올린 이 시간표 사진을 꼼꼼하게 분석해줘.\n1. 요일(월~금), 교시(1~6교시), 과목명, 담당교사, 수업장소를 정확하게 인식해서 텍스트로 추출해줘.\n2. 다음 단계(P4)에서 앱 코드에 바로 넣을 수 있게 아래 열 순서의 표 형식으로 출력해줘:\n   [요일, 교시, 시작시간, 종료시간, 과목명, 담당교사, 교실장소]"}, {"id": "P2", "title": "학사일정 사진 인식", "time": "10–15분", "desc": "학사일정 사진을 표로 정리", "text": "안티그래비티, 이 학교 학사일정표 사진에서 주요 행사(중간고사, 기말고사, 축제, 체험학습, 방학식)의 날짜와 행사명을 모두 찾아서 정리해줘.\n구글 스프레드시트용으로 [시작일, 종료일, 행사명, 대상학년, 상세내용] 표로 만들어줘."}, {"id": "P3", "title": "디자인 톤 지정", "time": "15–25분", "desc": "토스 스타일 카드 디자인", "text": "안티그래비티, 전체 디자인은 '토스(Toss)' 앱처럼 모던하고 극도로 깔끔한 카드형 대시보드로 만들어줘.\n1. 배경색은 눈이 편안한 밝은 슬레이트톤(#F8FAFC)으로 하고, 카드는 순백색(#FFFFFF)으로 배치해.\n2. 모든 카드는 border-radius: 16px에 아주 부드러운 그림자(box-shadow: 0 4px 20px rgba(0,0,0,0.06))를 줘.\n3. 교실 75인치 전자칠판에서 맨 뒤 학생도 잘 보이도록 폰트 크기를 시원시원하게 잡고 한글 Pretendard 폰트를 써줘.\n4. 카테고리마다 직관적인 귀여운 이모지(📅, 📢, 📝, 🍱, 🎂)를 적절히 배치해줘."}, {"id": "P4", "title": "대시보드 뼈대 생성", "time": "25–45분", "desc": "7종 카드 웹앱 만들기", "text": "안티그래비티, 중학교 학급 담임교사를 위한 '우리 반 스마트 대시보드 웹앱'을 만들고 싶어.\nindex.html 단일 파일로 작성해줘.\n\n[레이아웃 및 디자인 요구조건]\n1. 디자인 스타일: 토스(Toss) 스타일의 미니멀 카드형 대시보드 (Pretendard 웹폰트, Tailwind CSS CDN 적용)\n2. 헤더 구성:\n   - 좌측: '청원중 2학년 1반 스마트 알리미' 타이틀과 '서로 존중하며 매일매일 함께 빛나는 우리 ✨' 급훈\n   - 우측 상단 액션 바: 실시간 디지털 시계, 다크모드 버튼, 새로고침 버튼\n3. 메인 그리드 (3열 반응형 카드 배치):\n   - 카드 1 [2학년 1반 시간표]: 교시별 시간, 과목, 교사, 장소 표시 (오늘 요일 자동 감지 + 오늘/주간 토글 버튼)\n   - 카드 2 [오늘의 시간표 변동]: 결보강이 있으면 상단에 노란 경고 띠로 긴급 안내\n   - 카드 3 [수행평가 & 과제 마감]: 마감 임박 순 정렬, D-Day/D-1/D-3 자동 뱃지\n   - 카드 4 [학교 학사일정]: 주요 학사일정 타임라인 목록\n   - 카드 5 [오늘의 맛있는 급식 🍱]: 나이스(NEIS) 급식 API로 자동 조회한 식단 메뉴와 칼로리 표시\n   - 카드 6 [이번 달 생일 친구 🎂]: 이번 달 생일자 명단과 폭죽(Confetti) 축하 효과\n   - 카드 7 [담임선생님의 한마디]: 담임교사의 따뜻한 응원 메시지 카드\n4. 시간표 데이터: 앞에서 P1으로 추출한 시간표 표가 있으면, 그 내용을 코드 안의 TIMETABLE 상수에 그대로 넣어 시간표 카드에 표시해줘. 시간표는 학기당 1번 바뀌는 정적 데이터라 구글 시트 실시간 연동은 하지 마. (다음 단계 P5에서 시간표 URL을 요구하면 무시하고 이 TIMETABLE을 유지해.) 오늘/주간 토글 버튼은 반드시 유지해.\n\n가짜 샘플 데이터(Mock)는 절대 넣지 마. 각 카드는 빈 상태 안내 문구(예: \"등록된 결보강이 없어요 🙂\")로 보여주는 완전한 index.html 코드를 생성해줘."}, {"id": "P5", "title": "구글 시트 실시간 연동", "time": "45–60분", "desc": "시트 5개, 하나씩 연결", "text": "", "subs": [{"id": "P5-1", "title": "결보강 시트 연결", "text": "안티그래비티, 방금 만든 index.html에 결보강 스프레드시트 1개를 연결해줘.\nconst SHEET_URL = \"여기에 결보강 시트 링크 붙여넣기\";  // [공유]→\"링크가 있는 모든 사용자\"로 바꾼 뒤 주소창 링크 통째로\n1. 정규식 /\\/d\\/([a-zA-Z0-9-_]+)/ 로 위 링크에서 시트 ID 추출\n2. https://docs.google.com/spreadsheets/d/시트ID/gviz/tq?tqx=out:csv 로 첫 시트를 CSV로 조회 (PapaParse 5.4.1)\n3. 첫 행 헤더 단어로 열 매칭 (날짜/교시/기존과목/변경과목/보강교사/수업장소/학생안내사항 — 순서 무관)\n4. 결보강 카드에만 연결. 오늘 날짜 행이 있으면 상단에 노란 경고 띠로 안내\n5. 이 카드의 기존 가짜 데이터 전부 삭제 (mock 절대 금지!) / 내용 없으면 빈 상태 안내 (\"등록된 결보강이 없어요 🙂\")\n6. try/catch로 감싸고, 우측 상단 '새로고침 🔄' 버튼으로 이 시트 다시 읽기. 다른 카드는 건드리지 마."}, {"id": "P5-2", "title": "수행평가·과제 시트 연결", "text": "안티그래비티, 방금 만든 index.html에 수행평가_과제 스프레드시트 1개를 연결해줘.\nconst SHEET_URL = \"여기에 수행평가_과제 시트 링크 붙여넣기\";  // [공유]→\"링크가 있는 모든 사용자\"로 바꾼 뒤 주소창 링크 통째로\n1. 정규식 /\\/d\\/([a-zA-Z0-9-_]+)/ 로 위 링크에서 시트 ID 추출\n2. https://docs.google.com/spreadsheets/d/시트ID/gviz/tq?tqx=out:csv 로 첫 시트를 CSV로 조회 (PapaParse 5.4.1)\n3. 첫 행 헤더 단어로 열 매칭 (구분/과목명/제목/마감일/제출방법/준비물_세부내용/반영비율 — 순서 무관)\n4. 수행평가·과제 카드에만 연결. D-Day·D-1·D-3 뱃지 + 마감 임박순 정렬\n5. 이 카드의 기존 가짜 데이터 전부 삭제 (mock 절대 금지!) / 내용 없으면 빈 상태 안내 (\"등록된 수행평가·과제가 없어요 🙂\")\n6. try/catch로 감싸고, 우측 상단 '새로고침 🔄' 버튼으로 이 시트 다시 읽기. 다른 카드는 건드리지 마."}, {"id": "P5-3", "title": "학사일정 시트 연결", "text": "안티그래비티, 방금 만든 index.html에 학사일정 스프레드시트 1개를 연결해줘.\nconst SHEET_URL = \"여기에 학사일정 시트 링크 붙여넣기\";  // [공유]→\"링크가 있는 모든 사용자\"로 바꾼 뒤 주소창 링크 통째로\n1. 정규식 /\\/d\\/([a-zA-Z0-9-_]+)/ 로 위 링크에서 시트 ID 추출\n2. https://docs.google.com/spreadsheets/d/시트ID/gviz/tq?tqx=out:csv 로 첫 시트를 CSV로 조회 (PapaParse 5.4.1)\n3. 첫 행 헤더 단어로 열 매칭 (시작일/종료일/행사명/대상/상세내용/준비물 — 순서 무관)\n4. 학사일정 카드에만 연결. 날짜순 타임라인으로 표시\n5. 이 카드의 기존 가짜 데이터 전부 삭제 (mock 절대 금지!) / 내용 없으면 빈 상태 안내 (\"등록된 학사일정이 없어요 🙂\")\n6. try/catch로 감싸고, 우측 상단 '새로고침 🔄' 버튼으로 이 시트 다시 읽기. 다른 카드는 건드리지 마."}, {"id": "P5-4", "title": "생일 시트 연결", "text": "안티그래비티, 방금 만든 index.html에 생일 스프레드시트 1개를 연결해줘.\nconst SHEET_URL = \"여기에 생일 시트 링크 붙여넣기\";  // [공유]→\"링크가 있는 모든 사용자\"로 바꾼 뒤 주소창 링크 통째로\n1. 정규식 /\\/d\\/([a-zA-Z0-9-_]+)/ 로 위 링크에서 시트 ID 추출\n2. https://docs.google.com/spreadsheets/d/시트ID/gviz/tq?tqx=out:csv 로 첫 시트를 CSV로 조회 (PapaParse 5.4.1)\n3. 첫 행 헤더 단어로 열 매칭 (월/일/이름/축하메시지 — 순서 무관)\n4. 생일 카드에만 연결. 이번 달 생일자만 표시, 오늘이 생일이면 폭죽(Confetti) 효과\n5. 이 카드의 기존 가짜 데이터 전부 삭제 (mock 절대 금지!) / 내용 없으면 빈 상태 안내 (\"이번 달 생일인 친구가 없어요 🎂\")\n6. try/catch로 감싸고, 우측 상단 '새로고침 🔄' 버튼으로 이 시트 다시 읽기. 다른 카드는 건드리지 마."}, {"id": "P5-5", "title": "공지사항 시트 연결 (선택)", "text": "안티그래비티, 방금 만든 index.html에 공지사항 스프레드시트 1개를 연결해줘.\nconst SHEET_URL = \"여기에 공지사항 시트 링크 붙여넣기\";  // [공유]→\"링크가 있는 모든 사용자\"로 바꾼 뒤 주소창 링크 통째로\n1. 정규식 /\\/d\\/([a-zA-Z0-9-_]+)/ 로 위 링크에서 시트 ID 추출\n2. https://docs.google.com/spreadsheets/d/시트ID/gviz/tq?tqx=out:csv 로 첫 시트를 CSV로 조회 (PapaParse 5.4.1)\n3. 첫 행 헤더 단어로 열 매칭 (제목/내용/게시일 — 순서 무관)\n4. 공지사항 카드에만 연결. 최신 공지는 첫 화면 팝업 + [오늘 하루 보지 않기], 헤더 🔔 버튼으로 지난 공지 목록\n5. 이 카드의 기존 가짜 데이터 전부 삭제 (mock 절대 금지!) / 내용 없으면 빈 상태 안내 (\"등록된 공지사항이 없어요 📣\")\n6. try/catch로 감싸고, 우측 상단 '새로고침 🔄' 버튼으로 이 시트 다시 읽기. 다른 카드는 건드리지 마."}]}, {"id": "P6", "title": "보너스 · 급식 알레르기 강조", "time": "시간 남으면", "desc": "알레르기 식품 빨간 표시", "text": "안티그래비티, 급식 카드에 '알레르기 유발 식품 강조' 기능을 추가해줘. (시간이 남으면 도전하는 보너스!)\n\n1. 나이스(NEIS) 급식 API 메뉴 뒤의 숫자 코드(알레르기 유발 식품 번호)를 빨간색으로 표시해줘.\n2. 급식 카드 상단에 \"오늘의 알레르기 유발 식품: 밀(1)·대두(5)\" 같은 한 줄 요약을 추가해줘.\n3. 기존에 잘 동작하는 카드들은 절대 건드리지 마."}, {"id": "P7", "title": "만능 · 고쳐줘/바꿔줘/알려줘", "time": "막혔을 때", "desc": "AI 디버깅 3종 세트", "text": "[만능 ① 고쳐줘형]\n안티그래비티, 지금 코드에서 [안 되는 부분: 예) 새로고침 버튼 클릭]이 안 돼.\n1. 원인을 먼저 찾아서 코딩을 모르는 사람도 이해하게 설명해줘.\n2. 고친 뒤에는 '어디를 어떻게 바꿨는지' 3줄로 요약해줘.\n\n========================================\n\n[만능 ② 추가해줘형]\n안티그래비티, [추가할 기능: 예) 학부모 공지 팝업] 기능을 추가해줘.\n단, 지금 잘 동작하는 기존 기능은 절대 건드리지 말고 새 기능만 따로 붙여줘.\n\n========================================\n\n[만능 ③ 설명해줘형]\n안티그래비티, 방금 만든 [기능명: 예) D-Day 뱃지]가 어떤 원리로 동작하는지,\n코딩을 전혀 모르는 선생님도 이해할 수 있게 3단계로 쉽게 설명해줘."}, {"id": "P8", "title": "심화 · 나이스 급식 API", "time": "도전 과제", "desc": "NEIS API로 급식 조회", "text": "안티그래비티, 대시보드의 급식 카드를 업그레이드해줘. (심화 도전!)\n\n1. 구글 시트 대신 나이스(NEIS) 교육정보개방포털 급식 API(mealServiceDietInfo, 교육청 코드 B10, 학교 코드 7051208)로 오늘 날짜(YYYYMMDD)의 급식 메뉴를 직접 조회하게 바꿔줘. (이 API는 인증키 없이 바로 호출할 수 있어.)\n2. 메뉴에 적힌 알레르기 번호(1~18번)는 한글 식품명으로 변환해서 보여줘.\n3. 주말·공휴일처럼 급식이 없는 날에는 \"오늘 급식 정보가 아직 등록되지 않았어요\"라고 친절하게 안내해줘."}, {"id": "P9", "title": "심화 · 학생명단 + 출결 DB", "time": "도전 과제", "desc": "명단 업로드 후 출결 기록", "text": "안티그래비티, 대시보드에 '오늘의 출결' 카드를 추가해줘. (심화 도전!)\n\n[준비 1 — 학생명단 시트]\n내 구글 시트에 [학생명단] 탭이 있어. 열은 [번호, 이름] 순서야.\n아래 상수에 학생명단 CSV URL을 넣어줘:\nconst ROSTER_URL = \"[여기에 학생명단 시트 CSV URL 붙여넣기]\";\n\n[준비 2 — 출결 저장용 Apps Script]\n아래 Apps Script 웹 앱 URL을 복사해서 [여기에 붙여넣기] 자리에 넣어줘.\nconst ATTENDANCE_API = \"[여기에 Apps Script 웹 앱 URL 붙여넣기]\";\n\n[기능 요구조건]\n1. 페이지를 열면 ROSTER_URL에서 학생명단(번호·이름)을 불러와 한 줄씩 표시해줘.\n2. 각 학생마다 [출석][지각][조퇴][결석] 버튼을 만들어줘. 기본값은 '출석'으로 미리 선택 표시해줘.\n3. 카드 상단에 오늘 날짜와 출석/지각/조퇴/결석 인원 요약 뱃지를 보여줘.\n4. [출결 저장하기] 버튼을 누르면, 출석이 아닌 학생(지각·조퇴·결석)만 골라서 fetch POST로 {날짜, 번호, 이름, 상태}를 ATTENDANCE_API에 전송해서 구글 시트 '출결기록' 탭에 저장해줘.\n5. 저장 전에 \"출결을 기록할까요?\" 확인창을 한 번 띄워서 실수를 막아줘.\n6. 페이지를 열 때는 fetch GET(?date=오늘날짜)으로 오늘 출결을 미리 불러와서 버튼 상태를 표시해줘.\n7. 지금 잘 동작하는 기존 카드(시간표·급식 등)는 절대 건드리지 말고 새 카드만 추가해줘."}];
let idx = 0, large = false;
const nav = document.getElementById('nav');
const box = document.getElementById('box');

PROMPTS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'step-btn';
  b.innerHTML =
    '<div class="num">' + p.id + '</div>' +
    '<div class="meta"><div class="t">' + esc(p.title) + '</div>' +
    '<div class="d">' + esc(p.desc) + '</div></div>' +
    '<div class="time">' + esc(p.time) + '</div>';
  b.onclick = () => show(i);
  nav.appendChild(b);
});

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function show(i) {
  idx = Math.max(0, Math.min(PROMPTS.length - 1, i));
  const p = PROMPTS[idx];
  document.querySelectorAll('.step-btn').forEach((b, j) =>
    b.classList.toggle('active', j === idx));
  document.getElementById('badge').textContent = p.id;
  document.getElementById('title').textContent = p.title;
  document.getElementById('time').textContent = p.time + ' · ' + p.desc;
  const copyBtn = document.getElementById('copyBtn');
  if (p.subs) {
    box.innerHTML = p.subs.map((sb, si) =>
      '<div class="sub"><div class="sub-head"><span class="sub-badge">' + esc(sb.id) + '</span>' +
      '<span class="sub-title">' + esc(sb.title) + '</span><div class="spacer"></div>' +
      '<button class="btn btn-copy btn-mini" data-si="' + si + '">📋 복사</button></div>' +
      '<pre class="sub-text">' + esc(sb.text) + '</pre></div>').join('');
    copyBtn.style.display = 'none';
    box.querySelectorAll('.btn-mini').forEach(b => b.onclick = async (e) => {
      const t = p.subs[+e.currentTarget.dataset.si].text;
      try { await navigator.clipboard.writeText(t); } catch (err) {}
      const btn = e.currentTarget;
      btn.textContent = '✅ 복사됨'; setTimeout(() => btn.textContent = '📋 복사', 1200);
    });
  } else {
    box.textContent = p.text;
    copyBtn.style.display = '';
  }
  box.scrollTop = 0;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === PROMPTS.length - 1;
  document.getElementById('pgText').textContent = (idx + 1) + ' / ' + PROMPTS.length;
  document.getElementById('pgBar').style.width = ((idx + 1) / PROMPTS.length * 100) + '%';
  copyBtn.classList.remove('done'); copyBtn.textContent = '📋 복사하기';
}

document.getElementById('copyBtn').onclick = async (e) => {
  const t = PROMPTS[idx].text;
  try { await navigator.clipboard.writeText(t); }
  catch (err) {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const btn = e.currentTarget;
  btn.classList.add('done'); btn.textContent = '✅ 복사됨!';
  setTimeout(() => { btn.classList.remove('done'); btn.textContent = '📋 복사하기'; }, 1600);
};

document.getElementById('fontBtn').onclick = (e) => {
  large = !large;
  box.classList.toggle('large', large);
  e.currentTarget.textContent = large ? '🔍 보통' : '🔍 크게';
};

document.getElementById('prevBtn').onclick = () => show(idx - 1);
document.getElementById('nextBtn').onclick = () => show(idx + 1);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(idx + 1);
  else if (e.key === 'ArrowLeft') show(idx - 1);
});

show(0);
</script>
